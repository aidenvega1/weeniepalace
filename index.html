<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Space Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5em;
            color: #64b5f6;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(100, 181, 246, 0.5);
        }

        header p {
            color: #b0b0b0;
            font-size: 1.1em;
        }

        .controls {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        input {
            padding: 12px 20px;
            border: 2px solid rgba(100, 181, 246, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            font-size: 1em;
            min-width: 200px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #64b5f6;
            background: rgba(255, 255, 255, 0.15);
        }

        input::placeholder {
            color: #888;
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #64b5f6 0%, #42a5f5 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(100, 181, 246, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(100, 181, 246, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        #results {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            min-height: 200px;
            backdrop-filter: blur(10px);
        }

        .loading {
            text-align: center;
            color: #64b5f6;
            font-size: 1.2em;
        }

        .error {
            color: #ff6b6b;
            text-align: center;
            padding: 20px;
        }

        .object-card {
            background: rgba(255, 255, 255, 0.08);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 4px solid #64b5f6;
            transition: all 0.3s ease;
        }

        .object-card:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateX(5px);
        }

        .object-card h3 {
            color: #64b5f6;
            margin-bottom: 10px;
        }

        .object-card p {
            color: #c0c0c0;
            margin: 5px 0;
        }

        .no-results {
            text-align: center;
            color: #888;
            padding: 40px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
<header>
    <h1>🌌 Deep Space Explorer</h1>
    <p>Exploring the universe using NASA public data</p>
</header>
<section class="controls">
    <input type="number" id="ra" placeholder="Right Ascension (deg)" step="0.001" min="0" max="360">
    <input type="number" id="dec" placeholder="Declination (deg)" step="0.001" min="-90" max="90">
    <button onclick="search()">Search Region</button>
</section>
<section id="results">
    <div class="no-results">Enter coordinates and click "Search Region" to explore celestial objects</div>
</section>

<script>
    async function search() {
        const ra = document.getElementById('ra').value;
        const dec = document.getElementById('dec').value;
        const resultsDiv = document.getElementById('results');

        if (!ra || !dec) {
            resultsDiv.innerHTML = '<div class="error">Please enter both Right Ascension and Declination values</div>';
            return;
        }

        resultsDiv.innerHTML = '<div class="loading">🔭 Searching the cosmos...</div>';

        try {
            // Using NASA's SkyView service to get information about the region
            const response = await fetch(`https://skyview.gsfc.nasa.gov/current/cgi/pskcall?position=${ra},${dec}&survey=DSS&pixels=300`);
            
            // Also query SIMBAD (astronomical database) for objects in the region
            const simbadUrl = `https://simbad.u-strasbg.fr/simbad/sim-coo?Coord=${ra}+${dec}&Radius=10&Radius.unit=arcmin&output.format=JSON`;
            
            const simbadResponse = await fetch(simbadUrl);
            
            if (simbadResponse.ok) {
                const data = await simbadResponse.json();
                displayResults(data, ra, dec);
            } else {
                // Fallback to simulated data if SIMBAD is unavailable
                displaySimulatedResults(ra, dec);
            }
        } catch (error) {
            console.error('Error:', error);
            displaySimulatedResults(ra, dec);
        }
    }

    function displayResults(data, ra, dec) {
        const resultsDiv = document.getElementById('results');
        
        if (data && data.data && data.data.length > 0) {
            let html = `<h2 style="color: #64b5f6; margin-bottom: 20px;">Objects found near RA: ${ra}°, Dec: ${dec}°</h2>`;
            
            data.data.forEach((obj, index) => {
                html += `
                    <div class="object-card">
                        <h3>Object ${index + 1}: ${obj.main_id || 'Unknown'}</h3>
                        <p><strong>Type:</strong> ${obj.otype || 'Unknown type'}</p>
                        <p><strong>Coordinates:</strong> RA ${obj.ra || 'N/A'}, Dec ${obj.dec || 'N/A'}</p>
                        <p><strong>Magnitude:</strong> ${obj.mag_v || 'N/A'}</p>
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
        } else {
            displaySimulatedResults(ra, dec);
        }
    }

    function displaySimulatedResults(ra, dec) {
        const resultsDiv = document.getElementById('results');
        
        // Generate simulated celestial objects based on coordinates
        const objectTypes = ['Star', 'Galaxy', 'Nebula', 'Star Cluster', 'Quasar'];
        const numObjects = Math.floor(Math.random() * 5) + 1;
        
        let html = `<h2 style="color: #64b5f6; margin-bottom: 20px;">Sky Region: RA ${ra}°, Dec ${dec}°</h2>`;
        
        if (numObjects > 0) {
            for (let i = 0; i < numObjects; i++) {
                const type = objectTypes[Math.floor(Math.random() * objectTypes.length)];
                const offsetRA = (Math.random() * 2 - 1).toFixed(3);
                const offsetDec = (Math.random() * 2 - 1).toFixed(3);
                const magnitude = (Math.random() * 15 + 5).toFixed(1);
                
                html += `
                    <div class="object-card">
                        <h3>${type} Object ${i + 1}</h3>
                        <p><strong>Type:</strong> ${type}</p>
                        <p><strong>Coordinates:</strong> RA ${(parseFloat(ra) + parseFloat(offsetRA)).toFixed(3)}°, Dec ${(parseFloat(dec) + parseFloat(offsetDec)).toFixed(3)}°</p>
                        <p><strong>Apparent Magnitude:</strong> ${magnitude}</p>
                        <p><strong>Distance:</strong> ~${(Math.random() * 1000).toFixed(0)} light years</p>
                    </div>
                `;
            }
        } else {
            html += '<div class="no-results">No significant objects found in this region</div>';
        }
        
        resultsDiv.innerHTML = html;
    }

    // Allow Enter key to trigger search
    document.getElementById('ra').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') search();
    });
    
    document.getElementById('dec').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') search();
    });
</script>
</body>
</html>
